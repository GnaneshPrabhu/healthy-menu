<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Your Brand Name</title><link rel="stylesheet" href="./admin.css"></head><body>
<div id="loginView" class="center"><div class="login-card"><div class="logo">Your Brand Name</div><p class="eyebrow">ADMIN PORTAL</p><h1>Sign in</h1><p class="muted">Use the administrator account created in Supabase.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><p id="loginMsg" class="msg"></p></form></div></div>
<div id="appView" class="hidden"><aside><div class="side-brand">Your Brand Name</div><nav><button data-tab="dashboard">Overview</button><button data-tab="products">Products</button><button data-tab="categories">Categories</button><button data-tab="orders">Orders</button><button data-tab="settings">Business settings</button></nav><button id="logout" class="logout">Sign out</button></aside>
<main><header class="top"><div><p class="eyebrow">ADMIN</p><h1 id="pageTitle">Overview</h1></div><a href="./" target="_blank">View customer site ↗</a></header>
<section id="dashboard" class="tab"><div id="stats" class="stats"></div><div class="panel"><h2>Recent orders</h2><div id="recentOrders"></div></div></section>
<section id="products" class="tab hidden"><div class="toolbar"><h2>Products</h2><button id="addProduct">+ Add product</button></div><div id="productTable" class="panel"></div></section>
<section id="categories" class="tab hidden"><div class="toolbar"><h2>Categories</h2><button id="addCategory">+ Add category</button></div><div id="categoryTable" class="panel"></div></section>
<section id="orders" class="tab hidden"><div class="toolbar"><h2>Orders</h2><button id="refreshOrders">Refresh</button></div><div id="ordersTable" class="panel"></div></section>
<section id="settings" class="tab hidden"><div class="toolbar"><h2>Business settings</h2></div><div class="panel form-grid"><label>Brand name<input id="sBrand"></label><label>Phone<input id="sPhone"></label><label>WhatsApp<input id="sWhatsApp"></label><label>Instagram URL<input id="sInstagram"></label><label>Address<textarea id="sAddress"></textarea></label><label>Business hours<textarea id="sHours"></textarea></label><div><button id="saveSettings">Save settings</button><p id="settingsMsg" class="msg"></p></div></div></section>
</main></div>
<div id="productDialog" class="dialog hidden"><div class="dialog-card"><button class="x" data-close="productDialog">×</button><h2 id="productDialogTitle">Add product</h2><form id="productForm"><input type="hidden" id="pId"><label>Name<input id="pName" required></label><label>Category<select id="pCategory" required></select></label><label>Description<textarea id="pDescription"></textarea></label><label>Ingredients<textarea id="pIngredients"></textarea></label><label>Price (₹)<input id="pPrice" type="number" min="0" step="1" required></label><label>Sort order<input id="pSort" type="number" value="0"></label><label>Product image<input id="pImage" type="file" accept="image/*"></label><label class="check"><input id="pAvailable" type="checkbox" checked> Available for customers</label><button>Save product</button><p id="productMsg" class="msg"></p></form></div></div>
<div id="categoryDialog" class="dialog hidden"><div class="dialog-card small"><button class="x" data-close="categoryDialog">×</button><h2>Category</h2><form id="categoryForm"><input type="hidden" id="cId"><label>Name<input id="cName" required></label><label>Sort order<input id="cSort" type="number" value="0"></label><label class="check"><input id="cActive" type="checkbox" checked> Active</label><button>Save category</button></form></div></div>
<script type="module" src="./admin.js"></script></body></html>
